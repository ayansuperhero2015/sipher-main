<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORKNIFE 1v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game"></div>
<div id="storm-tint"></div>
<div id="hurt"></div>
<div id="scope" class="hidden"><i></i></div>
<div id="nums"></div>
<div id="hud" class="hidden"></div>
<div id="menu" class="hidden"></div>
<div id="pause" class="hidden"></div>
<div id="end" class="hidden"></div>
<div id="loading"><div class="ld-logo">FORKNIFE</div><div class="ld-sub">Loading the arena</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
const files = ['js/core.js', '../shared/avatar.js', 'js/audio.js', 'js/textures.js', 'js/world.js', 'js/build.js', 'js/edit.js', 'js/avatar.js',
  'js/fx.js', 'js/actors.js', 'js/bot.js', 'js/lobby.js', 'js/ui.js', 'js/main.js', 'js/looks.js'];
const BUILD = Date.now(); // always load fresh scripts
try {
  for (const f of files) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = f + '?v=' + BUILD; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + f));
      document.body.appendChild(s);
    });
  }
  try { await Promise.race([document.fonts.load('700 28px "Barlow Condensed"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* offline */ }
  G.boot();
  // Opened from Sipher's "Play with friends": join the party.
  if (window.SIPHER_PARTY) import('./js/party.js?v=' + BUILD).catch(err => console.error('Party failed to load', err));
} catch (e) {
  document.querySelector('.ld-sub').textContent = e.message;
  throw e;
}
</script>
</body>
</html>
